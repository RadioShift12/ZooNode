<!DOCTYPE html>
<html>
<head>
    <title>NTC Zoo Management</title>
    <style>
        .animal-card { border: 1px solid #ccc; padding: 10px; margin: 10px; border-radius: 8px; }
        #animal-list { display: flex; flex-wrap: wrap; }
    </style>
</head>
<body>
    <h1>Zoo Health Dashboard</h1>

    <form id="add-animal-form">
        <input type="text" id="name" placeholder="Animal Name" required>
        <input type="text" id="species" placeholder="Species" required>
        <select id="status">
            <option value="Healthy">Healthy</option>
            <option value="Sick">Sick</option>
            <option value="Critical">Critical</option>
        </select>
        <button type="submit">Update Animal</button>
    </form>

    <div id="animal-list">
    </div>

    <script src="script.js"></script>
</body>
</html>
